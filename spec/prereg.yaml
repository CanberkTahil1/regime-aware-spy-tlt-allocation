# Pre-registration (R1, 2026-10-28). Transcribed from CLAUDE.md (charter v2) before any rung result; its sha256 is
# recorded in reports/ledger.md. Changing any value after a result it governs exists is post-hoc (logged, counted).
version: 1
source: CLAUDE.md (charter v2, owner 2026-10-28)

windows:
  warmup:      {start: 1986-01-01, end: 1989-12-31, role: "estimation only; never scored"}
  development: {start: 1990-01-01, end: 2019-12-31, role: "expanding walk-forward; every ladder decision"}
  test:        {start: 2020-01-01, end: "last month Ken French has published at R5", role: "frozen rules run once",
                label: "seen by owner in v1, disclosed"}
  forward:     {start: "after R5", role: "optional monthly log"}
  legacy_v1:   # v1's own windows, used only for the R1 reconciliation table
    train:      {start: 2005-01-01, end: 2014-12-31}
    validation: {start: 2015-01-01, end: 2019-12-31}
    test:       {start: 2020-01-01, end: 2025-12-31}

crisis_windows:   # pre-defined (charter "Windows"); drawdowns reported on these only
  bonds_1994:  {start: 1994-02, end: 1994-11}
  dotcom:      {start: 2000-03, end: 2002-10}
  gfc:         {start: 2007-10, end: 2009-03}
  euro_2011:   {start: 2011-04, end: 2011-10}
  china_2015:  {start: 2015-05, end: 2016-02}
  q4_2018:     {start: 2018-09, end: 2018-12}
  covid:       {start: 2020-02, end: 2020-03}
  infl_2022:   {start: 2022-01, end: 2022-10}

ladder:   # pre-registered order; each rung adds ONE layer; parameters fixed from the literature, not searched
  - {id: L0, name: "SPY (proxy)"}
  - {id: L0-line, name: "SPY + T-bills at the rung's volatility", role: "benchmark every rung is judged against"}
  - {id: L1, name: "legacy v1 (frozen code + selected params) on new data and new accounting", role: "baseline to beat",
     walk_role: "comparison row, not a parent (post-hoc, owner O2.3)"}
  - {id: L2, name: "vol-targeted SPY", target_vol: 0.15, vol_window_days: 20, gross_cap: 2.0, band: false,
     source: "v1 legacy/backtest.py:57-70 (D2.3)"}
  - {id: L2-u, name: "vol-targeted SPY, 10% ex ante, cap 1.0, zoo vol", role: descriptive, target_vol: 0.10, gross_cap: 1.0}
  - {id: L3, name: "static 60/40 SPY/TLT", rebalance: monthly, band_pp: 5}
  - {id: L4, name: "inverse-vol SPY/TLT", vol_window_days: 63, rebalance: monthly, band: true}
  - {id: L4b, name: "ERC on the 2x2 covariance", role: zoo}
  - {id: L5, name: "L4 + portfolio vol target", target_vol: 0.10, mode: ex_ante, gross_cap: 1.0}
  - {id: L5-lev, name: "L5 with gross cap 1.5 and financing", gross_cap: 1.5}
  - {id: L6, name: "L5 + stock-bond correlation regime", corr_windows_days: [63, 126], threshold: 0.0,
     sensitivity: [-0.2, 0.2], sensitivity_role: descriptive, action: "TLT weight to cash when corr > threshold"}
  - {id: L7, name: "L6 + per-asset trend", rule: "hold sleeve only above its 10-month SMA (Faber)",
     impl: quantkit.signals.trend.faber}
  - {id: L8, name: "L7 + crash rule", rule: "de-risk to cash on drawdown/vol-spike trigger; no shorts",
     judged_by: quantkit.sizing.judge, against: ["vol targeting alone", "block-shuffled placebo"]}
zoo:
  registered_rows: [hmm_gate, jump_model_gate, ewma_fast, ewma_slow, gjr_garch_t, egarch_t, har, min_cdar, max_div,
                    gbm_risk_sizing, v1_spread_overlay_on_L5, v1_bollinger_overlay_on_L5]
  promotion: "never, unless re-registered"

promotion_rule:   # quantkit.ladder four-part rule
  min_effect: {delta_sharpe: 0.05, or_cdar_lower_pct: 15, at: "matched volatility"}
  test: "paired one-sided quantkit.stats.sharpe_diff_lw"
  robustness: ["no loss at 2x costs", "no loss at +75 bp financing", "no loss leave-one-crisis-out"]
  mcs: {level: 0.90, on: "vol-matched returns"}
  ties: simpler rung
  beyond_6040: {delta_sharpe_vs_vol_matched_L3: 0.05, role: descriptive}
  # R2 (D2.4, advisor, before any R2 result): values the rule left unstated
  walk: [L1, L2, L3, L4, L5]          # fixed sequence; L0 / L0-line benchmarks; L4b, L5-lev, L2-u, zoo descriptive
                                      # = R2's pre-registered walk, kept as recorded (stopped: L2 did not beat L1)
  # POST-HOC (owner O2.3, 2026-10-29, after R2 results; charter amendment 32bf308): parent chains, same promotion rule;
  # each chain walked from its first rung; rungs not built yet (L6-L8) join their chain in R3; counted in variants.csv
  walk_chains:
    vt_spy: [L0, L2]
    core: [L0, L3, L4, L5, L6, L7, L8]
  comparison_rows: [L1]              # every rung vs L1 at matched vol, descriptive (ΔSharpe, LW interval, CDaR)
  grid: daily bill-excess returns, 1990-01-01 -> 2019-12-31, each rung rescaled by one constant to 10% ann. vol
  alpha: 0.05
  mean_block: 21
  reps: 1000
  seed: 0
  knowledge_date: 2019-12-31
  stress_windows: development crisis windows (six, above)   # quantkit in-window check; its 2020/2022 default never used
  cdar_route: "compounded CDaR-95 of the candidate <= 0.85 x the incumbent rescaled ex post to the candidate vol (financed above 1x at bill + 25 bp)"
  legs: "no loss: dSharpe >= 0 at 2x costs, at +75 bp financing, and in each of the six leave-one-crisis-out samples (both routes); CDaR route also CDaR below the matched incumbent in each leg"
  cdar_only_step: "quantkit test, robust and MCS parts pass AND CDaR route + legs pass -> promoted; walk continues with a fresh registered Ladder on [that rung, remaining rungs]"

costs:   # per side, on TRUE traded turnover including vol-scaling trades
  spy_bp_per_side: 3
  treasury_bp_per_side: 2
  stress_multipliers: [2, 3]
  financing: {base: "H.15 bill rate", spread_bp: 25, stress_extra_bp: 75}
  cash: "H.15 bill rate on uninvested capital"
  shorts: forbidden

accounting:
  execution: "signals at close t (month-end close for monthly rungs), trades at close t+1"
  sharpe: "on excess returns over the bill"
  sortino: "excess returns, standard downside deviation vs 0"
  turnover: "traded turnover reported"

r1_expectations:   # BUILD_PROMPTS R1 "Pre-registered"
  v1_reproduction: "exact (<= 1e-12, as R0 E0.1)"
  correction_signs:
    financing: "<= 0 when gross > 1"
    t_plus_1: "<= 0 for a fast signal"

data_qa:   # D1.6; 2005-01 -> 2025-12, monthly, local Yahoo file as comparison only
  hi20_vs_spy: {corr_min: 0.98, te_max_annual: 0.015}
  gsw25_vs_tlt: {corr_min: 0.98, te_max_annual: 0.030, prior_disclosed: "sibling 2.06% (2019-10 -> 2026-08) seen before the band was set"}

# R3 (2026-10-29, owner O2.4 + advisor D3.1-D3.6, before any R3 result). L6-L8 are NOT walked; the walk verdict of R2
# stands (nothing promoted past SPY). Every R3 number is descriptive. Parameters: spec/rules.yaml `r3`.
r3_evaluation:
  walk: none                                   # owner O2.4; walk_chains stay cut at L5 in R3
  ablation:
    rows: {L6: L5, L7: L6, L8: L7}             # child: parent (one layer each)
    references: [parent, L3, L1, line]         # line = SPY + T-bills at the child's vol (R2 D2.8)
    match: "reference rescaled ex post to the child's development excess vol"
    intervals: {dsharpe: "LW 95%, one-sided p", drawdown: "dd_ratio_ci 95% (cdar-95, max_dd)"}
    holm_family: "every dSharpe p in reports/r3/ablation.csv"
  descriptive_rows: [L6-63, L6-126-th-0.2, L6-126-th+0.2, L7-on-L5, L7-63]
  crisis_owner: [bonds_1994, gfc, q4_2018]     # reported for L6 and L7 at matched risk (all six computed)
  gate_rule: "beats = gate vs parent one-sided LW p < 0.05 AND seed-0 block-shuffled placebo vs parent p >= 0.05 (matched vol)"
  placebo: {block_months: 12, seed: 0, seeds: "0-99 descriptive", sensitivity_block_months: 6}
  crash_judge: {impl: quantkit.sizing.judge, rule: dd, target: 0.10, sigma: 0.10, cap: 1.0, block: 21, seed: 0, draws: 1000}
  zoo_built: [hmm_gate, jump_model_gate, min_cdar, max_div]
  zoo_deferred_R4: [v1_spread_overlay_on_L5, v1_bollinger_overlay_on_L5, gbm_risk_sizing]

# R4 (2026-10-29, owner O3.1 + advisor D4.1-D4.7, before any R4 computation). Every R4 number is descriptive: no walk,
# no promotion, no verdict can change (R2 walk seats L1, post-hoc chains seat L0, R3 not walked per O2.4). Scored:
# development 1990-01-02 -> 2019-12-31 only; warm-up 1986-1989 estimation only; 2020+ is R5. Parameters: rules.yaml r4.
r4_zoo:   # O3.1: the three rows deferred from R3, defined here and hashed before any R4 number; zoo = never promoted,
          # cannot change any verdict, counted in DSR N (variants.csv) and in the PBO pool
  v1_spread_overlay_on_L5:   # D4.1
    signal: "legacy/signals/spread.py generate_spread_signals, unchanged; window 10, threshold 2.5 (v1 selected); input = SPY/TLT proxy daily simple returns (legacy_bridge.new_data_inputs, the L1/S7 path)"
    state: "z_t = (spread_t - mean) / sd over the 10 spreads ending at t-1 (v1 code); only the state is used, never v1's weights"
    action: "z_t > 2.5 => L5 SPY column 0 at row t; z_t < -2.5 => L5 TLT column 0 at row t (v1's short TLT leg floored); any other day incl. NaN z / zero sd => L5 unchanged"
    departure_from_v1: "unconditional: v1 used spread only in its VIX high-vol state (regime_allocation.py:178-213); VIX is excluded (O0.1), registered as a departure"
    decision: "close t (daily), traded t+1 by the accounting; regime.gate path (keep decided <= t), look-ahead test"
    vol_scale: "L5's (D3.1 form); L5's 5 pp band with the zero-target exit; re-entry from 0 stops at the band edge"
    report: [share of development days per state, traded turnover]
  v1_bollinger_overlay_on_L5:   # D4.1
    signal: "legacy/signals/bollinger.py generate_bollinger_signals, unchanged; window 10 (v1 passes z_window), num_std 2; input = SPY/TLT proxy total-return levels (new_data_inputs prices; ratio test is base-free)"
    action: "ratio_t > upper band => SPY column 0; ratio_t < lower band => TLT column 0; otherwise (incl. NaN bands) L5 unchanged"
    departure_from_v1: "unconditional: v1 used Bollinger only in its low-vol downtrend state; registered"
    decision: "as v1_spread_overlay_on_L5"
    vol_scale: "as v1_spread_overlay_on_L5"
    report: [share of development days per state, traded turnover]
  gbm_risk_sizing:   # D4.2 ("purged CV, 50% haircut")
    model: "quantkit.ml.lightgbm(task='regression'), fixed defaults (n_estimators 200, learning_rate 0.05, num_leaves 31, min_child_samples 20, subsample 0.8, subsample_freq 1, colsample_bytree 0.8, reg_lambda 0), seed 0, threads 1, search None, early_stopping None"
    label: "y_t = log sqrt(252 * mean(r^2)) of the unscaled L4 book's daily log net return over sessions t+2 .. t+22 (21 sessions; zero-mean, the zoo's QLIKE proxy); label_end_t = t+22"
    features: "at close t, data <= t: log sigma_zoo_t (annualised sqrt(252 f_t) of L5's stitched R2 forecast); log sqrt(252 mean r^2) of the L4 book's daily log net return over the 5, 21, 63, 252 sessions ending at t; SPY-TLT Pearson correlation over 63 sessions ending at t (regime.corr); SPY proxy 21-session compounded return ending at t; mmy_t (the lagged H.15 money-market yield the financing uses)"
    rows: "rows with any undefined feature or label are dropped and counted; training may use 1986-1989 (estimation only)"
    cv: "walk-forward, expanding, purged: one quantkit cv.Split per year-end y in 1989..2018: test = rows of year y+1, train = rows t with label_end_t <= last row of year y; purge 22, embargo 0, label_end passed to fit_cv; quantkit cv.check_split on every split (tested); predictions only from fit_cv's split results"
    haircut: "0.5, frozen, no sweep: log sigma_used_t = log sigma_zoo_t + 0.5 * (log sigma_gbm_t - log sigma_zoo_t)"
    sizing: "target_t = min(0.10 / sigma_used_t, 1.0) x L4's latest decided weights (L5's vol layer with sigma_used in place of sigma_zoo); rows before 1990 use sigma_zoo (warm-up); L5's 5 pp band"
    determinism: "1 vs N workers bit-identical (test)"
  gbm_risk_sizing_raw: {as: gbm_risk_sizing, haircut: 0.0, role: "descriptive zoo row (the un-shrunk reading)"}

r4_evaluation:
  label: "built rungs; none promoted (R2 walk seats L1, post-hoc chains seat L0, R3 not walked per O2.4)"   # D4.4
  rungs: [L0, L1, L2, L3, L4, L5, L5-lev, L6, L7, L8]
  parents: {L2: L0, L3: L0, L4: L3, L5: L4, L6: L5, L7: L6, L8: L7, L5-lev: L5}   # O2.3 chains, post-hoc; L1, L0: none
  comparisons: {all: [line, L1, L3], L1: [line, L0], L0: [line]}
  match: "reference rescaled once ex post to the child's development excess vol (evaluate.rescale, bill + 25 bp above 1x; 100 bp in the +75 bp leg)"
  costs: {multipliers: [1, 2, 3], financing_extra_bp: 75}
  loco: "the six development crisis windows, one dropped at a time; matched once on the full sample"
  decades: [[1990-01-01, 1999-12-31], [2000-01-01, 2009-12-31], [2010-01-01, 2019-12-31]]
  rolling: {window_sessions: 1260, stats: ["excess Sharpe per rung", "dSharpe vs the parent matched once over development"]}
  power: {impl: quantkit.stats.power.periods_needed, alpha: 0.05, target: 0.8, sr: "per-period (ann / sqrt 252)", rho: "corr(child excess, matched parent excess)", nonpositive: "inf (measured edge <= 0)", label: "point estimate as true effect (optimistic); iid planning (quantkit HEADER)"}
  waterfall: "arithmetic annualised means: gross + cash - cost_spy - cost_tlt - financing = net; net - bill = excess; per-day identity <= 1e-10; CAGR gap shown apart; bars 1x, 2x, 3x, +75 bp"
  sensitivity:   # D4.5, one factor at a time vs the registered rung; descriptive; registered in variants.csv first
    maturity: {years: [10, 20, 30], rungs: [L1, L3, L4, L5, L6, L7, L8], label: "GSW <n>y constant-maturity proxy, not QA'd vs an ETF", assert: "SVENY<n> reported from the 1986 warm-up start"}
    band_pp: {widths: [0.0, 2.5, 10.0], calendar: monthly, rungs: [L3, L4, L5, L6, L7]}
    calendar: {quarterly: "month-end rows of Mar/Jun/Sep/Dec at offset 0 for the mix, the L6 gate and the L7 read-back; vol scale and L8 brake stay daily", band_pp: 5, rungs: [L3, L4, L5, L6, L7]}
    untested_disclosed: ["quarterly timing luck (other month-in-quarter phases)", "band x calendar interactions"]
  dsr:   # D4.6
    pool: "development daily bill-excess returns of every variants.csv row with a return series and counted_in_dsr = yes (placebos already counted stay; 100-seed sets out; S0-S6 and diagnostics out), tranche offsets included (flag set yes before any DSR), plus v1's 648-config grid on the L1/S7 path (permitted data, realised-vol proxy, charter accounting), scored 1990-2019"
    n_eff: {impl: quantkit.stats.effective_trials, rho_star: 0.5, sensitivity: quantkit default, seed: 0}
    n_used: "n_eff + selection-only rows (walk_chains_O2.3: +1)"
    report: "quantkit.stats.dsr_effective for every rung above and for the best Sharpe in the pool; companions: DSR at raw N (sum n_configs) and without v1's grid; k_cut_sens"
  pbo:   # D4.7
    primary_pool: [L5, L4b, max_div, L5_vol_ewma_slow, L5_vol_ewma_fast, L5_vol_har, L5_vol_gjr_garch_t, L5_vol_egarch_t, hmm_gate, jump_model_gate, min_cdar, v1_spread_overlay_on_L5, v1_bollinger_overlay_on_L5, gbm_risk_sizing, gbm_risk_sizing_raw]
    dedupe: "exact-duplicate columns dropped before CSCV (first kept), dropped ids logged; zero-variance-half columns logged and dropped"
    blocks: 16
    descriptive_blocks: [8, 12]
    secondary_pool: "every selectable rung and sensitivity variant (L0, L1, L2, L2-u, L3, L4, L5, L5-lev, L6 + L6-63 / th -0.2 / th +0.2, L7 + L7-on-L5 / L7-63, L8, the R4 sensitivity books) + the deduped zoo; no placebos, no tranche offsets, no line; descriptive"
    inputs: "development daily excess returns, record offset, 1x costs"

# R5 (2026-10-29, owner instructions + advisor D5.1-D5.7, before any v2 test-window number; hashed in the ledger and
# then locked in spec/freeze.lock.json). The test run cannot change any development verdict (R2 walk seats L1, post-hoc
# chains seat L0, R3/R4 descriptive). Parameters: rules.yaml r5.
r5_test:
  label: "test window 2020-01 -> 2026-09, frozen rules run once; seen by owner in v1, disclosed"
  window: {start: 2020-01-02, end: 2026-09-30, last_kf_month: 2026-09, sessions: 1695,
           kf_fetch_utc: "2026-10-29T02:44:34Z", note: "a later KF refetch fails the freeze lock; it never extends the test"}
  continuation:   # D5.1
    rule: "registered procedures run on unchanged over 1986-01-02 -> 2026-09-30; books continuous (positions carried from 2019-12-31); test rows scored"
    vol_zoo_selection_years: [1989, 2025]     # year-end y picks year y+1 (registered causal rule, extended; was 1989..2018)
    vol_zoo_guard: "a pick must exist for every year 2020..2026 (no silent default on scored rows)"
    l8: "dd brake path on L7 net - bill from 1990-01-02 (unchanged)"
    dev_identity: "every extended book's rows <= 2019-12-31 equal the R2/R3 books (data/r2, data/r3) bit for bit, picks 1989..2018 identical; a mismatch stops the run (owner's call)"
  scope:   # D5.6
    official: [L0, L1, L2, L3, L4, L5, L6, L7, L8]   # tranche offset 0 only; L1 = comparison row
    comparison_rows: [L1]
    descriptive: [L5-lev, L2-u]
    benchmarks: ["L0-line per rung (quantkit bench.vol_matched, ex ante, window 63, lag 1)", "60/40 (L3)"]
    costs: {official: 1x, re_scored: [2x, 3x, f75], rungs: [L0, L1, L2, L3, L4, L5, L6, L7, L8, L5-lev],
            label: "frozen rule re-scored (robustness_legs, counted no)"}
    excluded: [L4b, max_div, min_cdar, hmm_gate, jump_model_gate, L5_vol_ewma_slow, L5_vol_ewma_fast, L5_vol_har,
               L5_vol_gjr_garch_t, L5_vol_egarch_t, v1_spread_overlay_on_L5, v1_bollinger_overlay_on_L5, gbm_risk_sizing,
               gbm_risk_sizing_raw, L6-63, L6-th-0.2, L6-th+0.2, L7-on-L5, L7-63, "tranche offsets 1-20",
               "placebo seeds beyond 0-99, block-6 sensitivity, zoo-gate placebos (hmm/jump)",   # D5.8 (was: placebos)
               "leave-one-crisis-out / decades / rolling 5y on the test", "R4 band / calendar / 20y / 30y sensitivity books"]
  sensitivity_10y:   # owner instruction (1), 2026-10-29: POST-HOC lead from R4, registered before the freeze
    label: "POST-HOC (owner, lead from R4): L5-L7 on a GSW 10-year constant-maturity bond leg instead of 25-year; not QA'd vs an ETF; cannot change any verdict; counted in DSR N"
    rungs: [L5, L6, L7]
    maturity_years: 10
    build: "robust.build_core(maturity=10) over the same window and rules; every parameter as the 25-year book"
    report: "test-window metrics; matched dSharpe vs the same 25-year rung and vs its own line; COVID / 2022 returns"
    official: false                           # the 25-year books remain the frozen, official ones
    in_family: false
  match:   # D5.2
    rule: "reference rescaled once ex post to the child's TEST-window excess vol (2020-01-02 -> 2026-09-30 rows only; evaluate.rescale, bill + 25 bp above 1x)"
    print: [k, share_rows_financed_above_1x]
    label: "matched ex post on the test window (one scalar), descriptive"
    crisis_note: "k uses the whole test window's vol, crises included; in-crisis vols are not matched (as in development)"
  family:   # D5.3: matched dSharpe, LW 95% (block 21, 1,000 draws, seed 0), one-sided p; Holm over every row below
    rows:
      L2: [parent L0, line]
      L3: [parent L0, L2, line]
      L4: [parent L3, L2, line]
      L5: [parent L4, L2, L3, line]
      L6: [parent L5, L2, L3, line]
      L7: [parent L6, L2, L3, line]
      L8: [parent L7, L2, L3, line]
    n_rows: 24
    beat_per_row: "point dSharpe >= +0.05 AND one-sided LW p < 0.05 (raw)"
    headline: {questions: {"beat plain vol-targeted SPY (L2)": "L3..L8 vs L2", "beat 60/40 (L3)": "L4..L8 vs L3",
                           "beat SPY + T-bills at matched risk (line)": "L2..L8 vs line"},
               yes_if: "some row of the question has point >= +0.05 AND Holm-adjusted p < 0.05 (Holm over all 24 rows)",
               else: "not shown in the test window (raw flags beside)"}
    one_directional: "a test beat seats or promotes nothing; a test no demotes nothing"
    power: "quantkit stats.power.power at the test length with the development point Sharpes and correlation of each pair (optimistic iid planning)"
    sign_agreement: "descriptive: sign(test dSharpe) == sign(development dSharpe of the same pair, matched on development)"
    descriptive_outside_family: ["CDaR-95 / max-DD ratios (dd_ratio_ci)", "COVID / 2022 panels", "L1 vs every rung", "L5-lev", "L2-u", "the 10-year row"]
  placebo_descriptive:   # D5.8 (advisor, after the pre-run review M4; before the freeze and any test number)
    gates: {L6: "correlation keep shuffled (parent L5)", L7: "trend keep shuffled (parent L6)",
            L8: "multiplier g shuffled (parent L7; R4 L8_placebo analog)"}
    shuffle: "test-window rows only (2020-01-02 .. 2026-09-30); never mixed with development states"
    block_months: 12          # r3_evaluation.placebo, reused (nothing searched)
    l8_block_rows: 21         # r3 L8 judge block, reused
    seeds: [0, 99]
    report: "gate percentile among seeds; placebo median / p05 / p95 of (i) matched dSharpe vs parent, (ii) matched cumulative return in covid and infl_2022"
    no_verdict: "no LW p-value, no beats_placebo verdict on the test (about 7 blocks: outside the R3 rule's calibration)"
    one_directional: "a test placebo can only qualify or weaken a claim; never upgrades a gate, never enters the family / Holm or the ablation chain; if a gate's 2022 gain is inside the placebo p05-p95 the README says: 2022 gain not distinguishable from holding fewer bonds at random times"
    readme_binding: "every test L6-L8 number sits beside the development placebo verdict (reports/r3/placebo.csv; L8: reports/r3/crash.json judge), built from facts"
    label: "placebo, descriptive (counted no); test window; seen by owner in v1, disclosed"
    caveat: "about 7 blocks; coarse; descriptive"
  crisis:
    windows: [covid, infl_2022]
    rows: "each official rung: cumulative in-window return vs its ex-ante line and vs its parent matched (D5.2); in-window mean weights SPY / TLT / cash"
  dsr:   # D5.4
    impl: "quantkit.stats.dsr_effective (headline) and quantkit.stats.dsr (raw-N companion) on each official rung's test-window daily excess returns"
    n_headline: 5          # R4 n_eff 3 + selection-only 1 (O2.3 chains) + 1 (the owner's post-hoc 10-year row)
    n_raw: 751             # variants.csv counted total 748 + 3 (sensitivity_10y_test)
    trial_var: "V = max(V_dev, 1/(T_test - 1)), both printed"
