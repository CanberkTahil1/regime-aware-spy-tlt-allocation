[project]
name = "rspy"
version = "0.0.1"
description = "regime-aware SPY/TLT/cash allocation v2: a pre-registered ladder judged against vol-matched SPY + T-bills"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Shared methods library: IMMUTABLE tagged install (non-editable); re-pin only with the owner's yes (CLAUDE.md).
    # Adding an extra at the same tag is not a re-pin.
    "quantkit[risk,viz] @ git+file:///Users/a90537/github/quantkit@v0.19.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "numba>=0.60",
    "pyyaml>=6.0",
    "matplotlib>=3.9",  # legacy v1 (backtest.py imports it at module top) and quantkit.viz PNG fallbacks
]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6", "hypothesis>=6.110", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/rspy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -p no:cacheprovider"
markers = [
    "legacy: reproduces v1 on its cached data/prices.csv (fails if the file is missing; deselect explicitly, D0.3)",
    "slow: long-running test (still part of make test)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["legacy"]  # frozen v1 code (D0.1): never reformatted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]
